<!DOCTYPE html>
<html lang="zh-CN" data-uk-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI Kit 橱窗 · Music light/dark</title>
  <link rel="stylesheet" href="./tokens.css" />
  <link rel="stylesheet" href="./components.css" />
  <link rel="stylesheet" href="./phone.css" />
  <style>
    .theme-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 0 20px 8px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .theme-bar button {
      border: 1px solid var(--uk-line);
      background: var(--uk-surface);
      color: var(--uk-ink);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .theme-bar button[aria-pressed="true"] {
      background: var(--uk-accent);
      color: var(--uk-on-accent);
      border-color: transparent;
    }
    .theme-bar .chip {
      font-size: 12px;
      color: var(--uk-muted);
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 28px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }
    .gallery-item h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--uk-ink-secondary);
    }
    .gallery .uk-phone { margin: 0 auto; }
    .swatch-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 8px;
    }
    .swatch {
      width: 72px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--uk-line);
      background: var(--uk-surface);
      font-size: 10px;
      color: var(--uk-muted);
      text-align: center;
    }
    .swatch i {
      display: block;
      height: 36px;
    }
    .swatch span { display: block; padding: 4px; }
  </style>
</head>
<body class="uk-studio">
  <header class="uk-studio-header">
    <h1>UI Kit · Apple Music–inspired</h1>
    <p class="uk-hint">
      亮/暗两套标准见 <code>THEME.md</code>。产品与 UX 用 <code>uk-*</code>；切换
      <code>data-uk-theme</code>。
    </p>
  </header>

  <div class="theme-bar" role="group" aria-label="主题">
    <button type="button" data-theme="dark" aria-pressed="true">Dark</button>
    <button type="button" data-theme="light" aria-pressed="false">Light</button>
    <span class="chip" id="theme-chip">当前：dark</span>
  </div>

  <div class="swatch-row" aria-label="色板预览">
    <div class="swatch"><i style="background:var(--uk-bg)"></i><span>bg</span></div>
    <div class="swatch"><i style="background:var(--uk-surface)"></i><span>surface</span></div>
    <div class="swatch"><i style="background:var(--uk-accent)"></i><span>accent</span></div>
    <div class="swatch"><i style="background:var(--uk-ink)"></i><span>ink</span></div>
    <div class="swatch"><i style="background:var(--uk-muted)"></i><span>muted</span></div>
  </div>

  <div class="gallery">
    <div class="gallery-item">
      <h2>列表 · 卡片 · 开关</h2>
      <div class="uk-phone" aria-label="列表示范">
        <div class="uk-phone-stage">
          <div class="uk-app">
            <div class="uk-topbar">
              <span class="uk-topbar__title">资料库</span>
              <button type="button" class="uk-topbar__action">编辑</button>
            </div>
            <div class="uk-body">
              <p class="uk-section-label">播放列表</p>
              <div class="uk-list">
                <button type="button" class="uk-cell">
                  <span class="uk-cell__main">
                    <span class="uk-cell__title">最近播放</span>
                    <span class="uk-cell__sub">128 首</span>
                  </span>
                  <span class="uk-cell__chevron" aria-hidden="true"></span>
                </button>
                <div class="uk-cell" style="cursor:default">
                  <span class="uk-cell__main">
                    <span class="uk-cell__title">自动下载</span>
                  </span>
                  <label class="uk-switch">
                    <input type="checkbox" checked />
                    <span class="uk-switch__track"></span>
                  </label>
                </div>
              </div>
              <div class="uk-card">
                <div class="uk-card__title">为你推荐</div>
                <p class="uk-card__desc">根据口味更新 · <span class="uk-tag">今日</span></p>
              </div>
            </div>
            <div class="uk-footer">
              <button type="button" class="uk-btn uk-btn--primary uk-btn--block">立即播放</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="gallery-item">
      <h2>半屏 · 分段 · 空态</h2>
      <div class="uk-phone" aria-label="半屏示范">
        <div class="uk-phone-stage">
          <div class="uk-app">
            <div class="uk-topbar">
              <button type="button" class="uk-back" aria-label="返回"></button>
              <span class="uk-topbar__title">浏览</span>
            </div>
            <div class="uk-body">
              <div class="uk-seg" role="tablist">
                <button type="button" class="uk-seg__item is-active">精选</button>
                <button type="button" class="uk-seg__item">电台</button>
                <button type="button" class="uk-seg__item">搜索</button>
              </div>
              <div class="uk-empty">
                <div class="uk-empty__icon">♪</div>
                <span class="uk-empty__title">暂无内容</span>
                收藏后会出现在这里
              </div>
            </div>
            <div class="uk-sheet is-open" role="dialog" aria-modal="true">
              <div class="uk-sheet__grab"></div>
              <h3 class="uk-sheet__title">添加到资料库</h3>
              <p class="uk-sheet__desc">已选 12 首，确认后同步到所有设备。</p>
              <div class="uk-sheet__actions">
                <button type="button" class="uk-btn uk-btn--ghost">取消</button>
                <button type="button" class="uk-btn uk-btn--primary">确认</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="gallery-item">
      <h2>底栏 · Toast · 标签</h2>
      <div class="uk-phone" aria-label="底栏示范">
        <div class="uk-phone-stage">
          <div class="uk-app">
            <div class="uk-topbar">
              <span class="uk-topbar__title">立即收听</span>
              <button type="button" class="uk-topbar__action">账户</button>
            </div>
            <div class="uk-body">
              <div class="uk-card">
                <div class="uk-card__title">精选混音</div>
                <p class="uk-card__desc">
                  <span class="uk-tag">新品</span>
                  <span class="uk-tag uk-tag--muted">空间音频</span>
                  <span class="uk-tag uk-tag--danger">限免将尽</span>
                </p>
              </div>
              <div class="uk-list">
                <button type="button" class="uk-cell" id="demo-toast-btn">
                  <span class="uk-cell__main">
                    <span class="uk-cell__title">点我弹出 Toast</span>
                  </span>
                  <span class="uk-cell__meta">演示</span>
                  <span class="uk-cell__chevron" aria-hidden="true"></span>
                </button>
              </div>
            </div>
            <nav class="uk-dock" aria-label="主导航">
              <button type="button" class="uk-dock__item is-active">听</button>
              <button type="button" class="uk-dock__item">浏览</button>
              <button type="button" class="uk-dock__item">资料库</button>
            </nav>
            <div class="uk-toast" id="demo-toast">已添加到资料库</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var chip = document.getElementById("theme-chip");
      document.querySelectorAll(".theme-bar [data-theme]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var theme = btn.getAttribute("data-theme");
          root.setAttribute("data-uk-theme", theme);
          document.querySelectorAll(".theme-bar [data-theme]").forEach(function (b) {
            b.setAttribute("aria-pressed", b === btn ? "true" : "false");
          });
          chip.textContent = "当前：" + theme;
        });
      });
      var toastBtn = document.getElementById("demo-toast-btn");
      var toast = document.getElementById("demo-toast");
      var timer;
      toastBtn.addEventListener("click", function () {
        toast.classList.add("is-show");
        clearTimeout(timer);
        timer = setTimeout(function () {
          toast.classList.remove("is-show");
        }, 1800);
      });
    })();
  </script>
</body>
</html>
