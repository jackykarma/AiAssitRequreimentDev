# 交互视觉合同（G2）· 私人项目默认无专职设计师。
# 分工：产品 prototype/index.html = 业务可点通；本文件 + prototype/ux/ = 交互规则精修 + 视觉落点。
# 视觉路径见 research/ui-kits/catalog.yaml：
#   若 projectStyle.locked=true → baseline=project（或 projectStyle.id），遵循项目自有 UI，不强制三选一
#   否则人选：ui-kit | painless | midoo | custom（custom / 偏离项目风格须 notes）
# 动效合同：research/ui-kits/MOTION.md；CLI：python -m aiassitrequreimentdev kits
# Pencil/Figma 仅探索，必须回流 HTML，链接进 artifacts。
# 无 UI：skip=true 并写 reason。
skip: false
reason: ""
uiKit:
  baseline: shared/ui-kit   # 仅 baseline=ui-kit 时有意义；research kit 可改指向或忽略
  showcase: prototype/shared/ui-kit/showcase.html
interactionRules:
  # - id: IR1
  #   when: 用户确认主操作
  #   behavior: 展示进度并禁用重复点击，成功 toast，失败进入异常屏
  #   states: idle|loading|success|error
  #   feedback: toast / sheet / 全屏异常
  #   coversAcceptance: [A1]
  []
visual:
  baseline: ui-kit   # project（项目锁定）| ui-kit | painless | midoo | custom
  theme: dark        # dark | light；ui-kit 路径须与 html data-uk-theme 一致
  notes: ""          # custom 或偏离 projectStyle 时必填
  motion: []         # 可选产品动效 M*；kit 级按压/揭晓见 MOTION.md
  # - id: M1
  #   trigger: 主操作成功
  #   effect: toast 滑入
  #   durationHint: ~300ms
htmlPrototype:
  entry: prototype/ux/index.html
  pages: []
acceptance: []
artifacts: []
# artifacts 示例（探索稿，非门禁主交付）：
# - type: pencil|figma|image|other
#   title: 视觉探索 A
#   uri: ""
#   note: 已回流到 prototype/ux/index.html
