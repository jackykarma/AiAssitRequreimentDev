[project]
name = "aiassitrequreimentdev"
version = "0.1.1"
description = "AiAssitRequreimentDev：规格门禁多智能体的变更合同与门禁检查"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
aiassitrequreimentdev = "aiassitrequreimentdev.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aiassitrequreimentdev*"]

[tool.setuptools.package-data]
aiassitrequreimentdev = [
    "templates/feature/*",
    "templates/feature/prototype/*",
    "templates/requirement/*",
]
