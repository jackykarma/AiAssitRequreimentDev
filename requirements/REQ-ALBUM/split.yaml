requirementId: REQ-ALBUM
decision: multi   # single | multi
rationale: >
  需求含可独立上线的验收批次：先交付「授权+时间线/图集可读」，
  再交付「大图/缩放/视频查看」，最后交付「收藏+回收站」。
  三批节奏与风险不同（媒体接入/手势性能/写操作与合规），适合拆成 3 个 feature；
  用 dependsOn 串依赖，避免一次塞进不可验收的大包。
confirmedByHuman: false
features:
  - id: FEAT-ALBUM-01
    title: 权限接入与时间线/图集浏览
    scope: >
      覆盖 PRD 能力块 C1/C2/C3 与验收 R-A1/R-A2/R-A6（浏览主路径）。
      含权限与隐私说明、MediaStore 读取、时间线、图集分组、空态/拒绝授权态。
      不含大图手势、收藏、删除。
    path: full
    dependsOn: []
  - id: FEAT-ALBUM-02
    title: 大图滑动缩放与视频查看
    scope: >
      覆盖 PRD 能力块 C4/C5 与验收 R-A3。
      含详情大图、左右滑动、无极缩放、视频预览/播放入口；依赖列表可点入。
      不含收藏与删除。
    path: full
    dependsOn:
      - FEAT-ALBUM-01
  - id: FEAT-ALBUM-03
    title: 收藏与删除/回收站
    scope: >
      覆盖 PRD 能力块 C6/C7 与验收 R-A4/R-A5。
      含收藏切换与收藏集合、删除入回收站、恢复与彻底删除。
      依赖媒体项可在浏览/大图中被选中操作。
    path: full
    dependsOn:
      - FEAT-ALBUM-01
      - FEAT-ALBUM-02
